specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SecretMarketplace
    network: sepolia
    source:
      address: "0xCE8607e616D7b76C69Be5464ee2f89DCD21aC854"
      abi: SecretMarketplace
      startBlock: 10401680
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AuctionClosed
        - AuctionCreated
        - AuctionForceClosed
        - BidPlaced
        - ExpectedAuthorUpdated
        - ExpectedWorkflowIdUpdated
        - ExpectedWorkflowNameUpdated
        - ExternalEventResolved
        - ForwarderAddressUpdated
        - OwnershipTransferred
        - ReputationUpdated
        - SecurityWarning
        - SellerRegistered
        - MarketplaceUpdated
      abis:
        - name: SecretMarketplace
          file: ./abis/SecretMarketplace.json
      eventHandlers:
        - event: AuctionClosed(indexed uint256,uint256,string,uint256)
          handler: handleAuctionClosed
        - event: AuctionCreated(indexed uint256,indexed uint256,string,string,uint256)
          handler: handleAuctionCreated
        - event: AuctionForceClosed(indexed uint256,uint256,string,uint256,int8)
          handler: handleAuctionForceClosed
        - event: BidPlaced(indexed uint256,uint256,uint256)
          handler: handleBidPlaced
        - event: ExpectedAuthorUpdated(indexed address,indexed address)
          handler: handleExpectedAuthorUpdated
        - event: ExpectedWorkflowIdUpdated(indexed bytes32,indexed bytes32)
          handler: handleExpectedWorkflowIdUpdated
        - event: ExpectedWorkflowNameUpdated(indexed bytes10,indexed bytes10)
          handler: handleExpectedWorkflowNameUpdated
        - event: ExternalEventResolved(indexed uint256,uint256,uint256)
          handler: handleExternalEventResolved
        - event: ForwarderAddressUpdated(indexed address,indexed address)
          handler: handleForwarderAddressUpdated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: ReputationUpdated(string,indexed uint256,int8,int256)
          handler: handleReputationUpdated
        - event: SecurityWarning(string)
          handler: handleSecurityWarning
        - event: SellerRegistered(string)
          handler: handleSellerRegistered
        - event: MarketplaceUpdated(indexed address,indexed address)
          handler: handleMarketplaceUpdated
      file: ./src/secret-marketplace.ts
  - kind: ethereum
    name: ExamplePredictionMarket
    network: sepolia
    source:
      address: "0x83B1F9d683b1a760569C237Bfb89C50112c05e24"
      abi: ExamplePredictionMarket
      startBlock: 10400148
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - EventCreated
        - ExamplePredictionMarketExpectedAuthorUpdated
        - ExamplePredictionMarketExpectedWorkflowIdUpdated
        - ExamplePredictionMarketExpectedWorkflowNameUpdated
        - ExamplePredictionMarketForwarderAddressUpdated
        - LiquidityWithdrawn
        - ExamplePredictionMarketOwnershipTransferred
        - ExamplePredictionMarketSecurityWarning
        - SettlementRequested
        - SettlementResponse
        - SharesPurchased
        - SharesRedeemed
      abis:
        - name: ExamplePredictionMarket
          file: ./abis/ExamplePredictionMarket.json
      eventHandlers:
        - event: EventCreated(indexed uint256,indexed
            address,string,uint256,uint256,uint256,address,address)
          handler: handleEventCreated
        - event: ExpectedAuthorUpdated(indexed address,indexed address)
          handler: handleExpectedAuthorUpdated
        - event: ExpectedWorkflowIdUpdated(indexed bytes32,indexed bytes32)
          handler: handleExpectedWorkflowIdUpdated
        - event: ExpectedWorkflowNameUpdated(indexed bytes10,indexed bytes10)
          handler: handleExpectedWorkflowNameUpdated
        - event: ForwarderAddressUpdated(indexed address,indexed address)
          handler: handleForwarderAddressUpdated
        - event: LiquidityWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleLiquidityWithdrawn
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: SecurityWarning(string)
          handler: handleSecurityWarning
        - event: SettlementRequested(indexed uint256,string)
          handler: handleSettlementRequested
        - event: SettlementResponse(indexed uint256,indexed uint8,indexed uint8)
          handler: handleSettlementResponse
        - event: SharesPurchased(indexed uint256,indexed address,indexed uint8,uint256,uint256)
          handler: handleSharesPurchased
        - event: SharesRedeemed(indexed uint256,indexed address,uint256,uint256)
          handler: handleSharesRedeemed
      file: ./src/example-prediction-market.ts
